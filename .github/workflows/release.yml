name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF_NAME#v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Build agent binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -ldflags="-H=windowsgui -s -w" -o dist/SiyahoPrinterAgent.exe ./agent

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer/windows/setup.iss

      - name: Optional code sign
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:CODESIGN_PFX_BASE64) { Write-Host "Skipping code sign (no secrets)"; exit 0 }
          $pfxPath = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $files = @("dist/SiyahoPrinterAgent.exe", "dist/SiyahoPrinterAgent-Setup-${{ steps.ver.outputs.version }}.exe")
          foreach ($f in $files) {
            if (Test-Path $f) {
              & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfxPath /p $env:CODESIGN_PFX_PASSWORD $f
            }
          }

      - name: Write releases.json
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $json = @{
            version = $version
            windows = "https://pos.siyaho.com/downloads/print-agent/SiyahoPrinterAgent-Setup-$version.exe"
            minVersion = $version
          } | ConvertTo-Json
          Set-Content -Path releases.json -Value $json -Encoding UTF8
          Copy-Item "dist/SiyahoPrinterAgent-Setup-$version.exe" "dist/SiyahoPrinterAgent-Setup-latest.exe" -ErrorAction SilentlyContinue

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/SiyahoPrinterAgent.exe
            dist/SiyahoPrinterAgent-Setup-${{ steps.ver.outputs.version }}.exe
            releases.json

      - name: Stage CDN artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path cdn | Out-Null
          Copy-Item "dist/SiyahoPrinterAgent-Setup-$version.exe" "cdn/SiyahoPrinterAgent-Setup-$version.exe"
          Copy-Item releases.json cdn/releases.json

      - name: Upload CDN artifacts
        uses: actions/upload-artifact@v4
        with:
          name: print-agent-cdn
          path: cdn

  deploy-cdn:
    needs: build-windows
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download CDN artifacts
        uses: actions/download-artifact@v4
        with:
          name: print-agent-cdn

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SELFHOSTED_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "CDN_DEPLOY_SKIP=true" >> "$GITHUB_ENV"
            echo "Skipping CDN deploy (SELFHOSTED_SSH_PRIVATE_KEY not set)"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 103.18.23.182 >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-server
            HostName 103.18.23.182
            User siyaho
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      - name: Prepare remote CDN directory
        if: env.CDN_DEPLOY_SKIP != 'true'
        run: |
          ssh deploy-server "
            mkdir -p /var/deployments/pos-downloads/print-agent &&
            chown -R siyaho:siyaho /var/deployments/pos-downloads
          "

      - name: Deploy print agent to CDN
        if: env.CDN_DEPLOY_SKIP != 'true'
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          set -euo pipefail
          DEST="/var/deployments/pos-downloads/print-agent"
          INSTALLER="$(find . -type f -name "SiyahoPrinterAgent-Setup-${VERSION}.exe" | head -n 1)"
          RELEASES_JSON="$(find . -type f -name "releases.json" | head -n 1)"
          if [ -z "$INSTALLER" ] || [ ! -f "$INSTALLER" ]; then
            echo "Installer not found for version ${VERSION}"
            find . -type f -print
            exit 1
          fi
          if [ -z "$RELEASES_JSON" ] || [ ! -f "$RELEASES_JSON" ]; then
            echo "releases.json not found"
            find . -type f -print
            exit 1
          fi
          echo "Using installer: $INSTALLER"
          echo "Using releases.json: $RELEASES_JSON"
          rsync -az -e ssh "$INSTALLER" "deploy-server:${DEST}/"
          rsync -az -e ssh "$RELEASES_JSON" "deploy-server:${DEST}/releases.json"
          ssh deploy-server "cd ${DEST} && ln -sf SiyahoPrinterAgent-Setup-${VERSION}.exe SiyahoPrinterAgent-Setup-latest.exe"
